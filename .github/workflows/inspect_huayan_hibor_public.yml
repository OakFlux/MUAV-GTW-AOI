name: Inspect public Hibor Huayan report links
on:
  push:
    branches:
      - tmp/huayan-hibor-public-inspect-20260905
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/inspect_huayan_hibor_public.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-hibor-public-inspection
          path: out_huayan_hibor_public/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
