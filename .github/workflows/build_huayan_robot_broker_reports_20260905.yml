name: Build Huayan Robotics broker research report package

on:
  push:
    branches:
      - tmp/huayan-robot-broker-reports-20260905

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF and image tools
        run: |
          python -m pip install --quiet 'httpx[http2]' pillow img2pdf pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf

      - name: Download public report pages, rebuild and validate PDFs
        run: python tmp/build_huayan_robot_broker_reports_20260905.py

      - name: Upload verified report package
        uses: actions/upload-artifact@v4
        with:
          name: huayan-robotics-01021-broker-research-reports
          path: out_huayan_robot_broker_reports_20260905/Huayan_Robotics_01021_Broker_Research_Reports_3.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
