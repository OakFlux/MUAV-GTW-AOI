name: Detect issuer and build Huayan Robotics broker report package

on:
  push:
    branches:
      - tmp/huayan-robotics-detect-reports-20260905

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --quiet 'httpx[http2]' beautifulsoup4 pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Detect exact issuer and package suitable reports
        run: python tmp/detect_and_build_huayan_robotics_reports_20260905.py
      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: huayan-robotics-broker-deep-reports
          path: out_huayan_robotics_reports_20260905/Huayan_Robotics_Broker_Deep_Reports.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
