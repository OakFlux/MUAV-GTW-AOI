name: Build corrected Ascletis public report package

on:
  push:
    branches:
      - tmp/ascletis-public-pages-20260906

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests pillow pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Build corrected package and verify every rendered page
        run: python tmp/build_ascletis_public_package_v2.py
      - name: Upload corrected package
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-01672-reports-v2
          path: out_ascletis_public_package_v2/ascletis_01672_reports_v2.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
