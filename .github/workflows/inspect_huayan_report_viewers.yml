name: Inspect Huayan report viewer networks

on:
  push:
    branches:
      - tmp/huayan-viewer-network-20260905

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Inspect viewer pages and requests
        run: node tmp/inspect_huayan_report_viewers.mjs
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: huayan-report-viewer-inspection
          path: out_huayan_report_viewers/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
