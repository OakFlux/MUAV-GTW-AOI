name: Build Xinyi Glass broker deep report pack

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build clean full-text PDFs and ZIP
        run: node tmp/build_xinyi_glass_reports_20260902.mjs

      - name: Validate PDFs and archive
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from pypdf import PdfReader

          base = Path('out_xinyi_glass_20260902')
          pdfs = sorted((base / 'reports').glob('*.pdf'))
          expected_min_pages = [8, 10]
          assert len(pdfs) == 2, f'Expected 2 PDFs, got {len(pdfs)}'
          for p, min_pages in zip(pdfs, expected_min_pages):
              reader = PdfReader(str(p))
              pages = len(reader.pages)
              assert pages >= min_pages, f'Too few pages in {p}: {pages} < {min_pages}'
              text = ''.join((page.extract_text() or '') for page in reader.pages[:5])
              assert '信义玻璃' in text or 'Xinyi Glass' in text, f'Missing company name in {p}'
              assert p.stat().st_size > 120000, f'PDF too small: {p.stat().st_size}'
              print(p.name, pages, p.stat().st_size)

          z = base / 'Xinyi_Glass_00868_Broker_Deep_Reports_2.zip'
          assert z.exists() and z.stat().st_size > 200000
          with ZipFile(z) as zf:
              bad = zf.testzip()
              assert bad is None, f'Bad ZIP member: {bad}'
              names = zf.namelist()
              assert len([n for n in names if n.lower().endswith('.pdf')]) == 2
              assert any(n.lower().endswith('readme.txt') for n in names)
              print('ZIP', z.stat().st_size, names)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: xinyi-glass-00868-broker-deep-reports
          path: out_xinyi_glass_20260902/Xinyi_Glass_00868_Broker_Deep_Reports_2.zip
          if-no-files-found: error
          retention-days: 1
