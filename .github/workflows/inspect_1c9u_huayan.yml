name: Inspect 1c9u Huayan report source

on:
  push:
    branches:
      - tmp/huayan-1c9u-20260905

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/inspect_1c9u_huayan.py
      - uses: actions/upload-artifact@v4
        with:
          name: onec9u-huayan-source-inspection
          path: out_1c9u_huayan/*
          if-no-files-found: error
          retention-days: 1
