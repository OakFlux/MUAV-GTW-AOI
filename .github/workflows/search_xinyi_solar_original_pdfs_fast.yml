name: Fast public search for original Xinyi Solar broker PDFs

on:
  push:
    branches:
      - tmp/xinyi-solar-web-search-fast-20260905

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Search public pages and validate PDFs
        run: python tmp/search_xinyi_solar_original_pdfs_fast.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-solar-original-pdf-search
          path: out_xinyi_solar_web_search_fast/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
