name: Probe Huayan Robotics broker report sources

on:
  push:
    branches:
      - tmp/huayan-report-source-probe-20260905

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/probe_huayan_report_sources_20260905.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-report-source-probe
          path: out_huayan_source_probe/*
          if-no-files-found: error
          retention-days: 1
