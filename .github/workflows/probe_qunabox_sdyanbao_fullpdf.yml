name: Probe public full PDF for Qunabox BOCI report

on:
  push:
    branches:
      - tmp/qunabox-boci-hibor-20260906

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Probe public APIs and object URLs
        run: python tmp/probe_qunabox_sdyanbao_fullpdf.py
      - name: Upload diagnostics and any PDFs
        uses: actions/upload-artifact@v4
        with:
          name: qunabox-sdyanbao-fullpdf-probe
          path: out_qunabox_sdyanbao_fullpdf/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
