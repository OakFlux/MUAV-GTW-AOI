name: Fetch Sinofert filing indexes

on:
  push:
    branches:
      - tmp/sinofert-treelazy-20260903

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch indexes
        run: python tmp/fetch_sinofert_indexes_20260903.py
      - uses: actions/upload-artifact@v4
        with:
          name: sinofert-filing-indexes
          path: out_sinofert_indexes_20260903/*
          if-no-files-found: error
          retention-days: 1
