name: Fast inspect Huayan public report metadata
on:
  push:
    branches: [tmp/huayan-metadata-fast-20260905]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/fast_inspect_huayan_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-metadata-fast
          path: out_huayan_metadata_fast/*
          if-no-files-found: error
          retention-days: 1
