name: Fetch Ascletis reports from open index

on:
  push:
    branches:
      - tmp/ascletis-open-index-20260906

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Fetch directory index and reports via public DNS fallback
        run: python tmp/fetch_ascletis_open_index_v2.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-open-index-results
          path: out_ascletis_open_index/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
