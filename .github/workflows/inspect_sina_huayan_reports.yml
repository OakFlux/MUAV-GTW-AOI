name: Inspect Sina Huayan Robotics reports

on:
  push:
    branches:
      - tmp/huayan-sina-search-20260905

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet httpx
      - run: python tmp/inspect_sina_huayan_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: sina-huayan-report-inspection
          path: out_sina_huayan_reports/*
          if-no-files-found: error
          retention-days: 1
