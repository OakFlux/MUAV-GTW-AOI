name: Inspect Sina Hong Kong reports for Huayan Robotics

on:
  push:
    branches:
      - tmp/huayan-sina-hkreports-20260905

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/inspect_sina_huayan_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-sina-hkreports-inspection
          path: out_huayan_sina_hkreports/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
