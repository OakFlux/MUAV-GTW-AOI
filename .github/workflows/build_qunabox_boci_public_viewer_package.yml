name: Build Qunabox package from official PDF and public viewer

on:
  push:
    branches:
      - tmp/hangyan-protected-link-20260906

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests pillow pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download, build, validate and package
        run: python tmp/build_qunabox_boci_public_viewer_package.py
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: qunabox-00917-broker-deep-reports-2
          path: out_qunabox_boci_public_viewer/Qunabox_00917_Broker_Deep_Reports_2.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qunabox-boci-public-viewer-diagnostics
          path: out_qunabox_boci_public_viewer/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
