name: Inspect Baogaobox Ascletis reports

on:
  push:
    branches:
      - tmp/ascletis-baogaobox-20260906

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Inspect public report resources
        run: node tmp/inspect_ascletis_baogaobox.mjs
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-baogaobox-inspection
          path: out_ascletis_baogaobox/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
