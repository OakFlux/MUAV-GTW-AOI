name: Probe official SDICSI Ascletis reports

on:
  push:
    branches:
      - tmp/ascletis-sdicsi-probe-20260906

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Probe official research pages and public PDF paths
        run: python tmp/probe_ascletis_sdicsi.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-sdicsi-results
          path: out_ascletis_sdicsi/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
