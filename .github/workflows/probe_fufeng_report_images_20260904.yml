name: Probe Fufeng public report page images

on:
  push:
    branches:
      - tmp/fufeng-broker-reports-20260904

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - name: Probe public image sequences
        run: python tmp/probe_fufeng_report_images_20260904.py
      - uses: actions/upload-artifact@v4
        with:
          name: fufeng-report-image-probe
          path: out_fufeng_image_probe/*
          if-no-files-found: error
          retention-days: 1
