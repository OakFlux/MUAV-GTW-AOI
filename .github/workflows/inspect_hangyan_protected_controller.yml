name: Inspect Hangyan protected link controller
on:
  push:
    branches:
      - tmp/hangyan-protected-controller-inspect-20260906
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - run: python tmp/inspect_hangyan_protected_controller.py
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-controller-inspection
          path: out_hangyan_controller/*
          retention-days: 1
          compression-level: 0
