name: Temporary inspect New Hope Service report network metadata

on:
  push:
    branches:
      - tmp/new-hope-service-network-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect page data and frontend API endpoints
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re, urllib.parse, urllib3
          import requests
          from bs4 import BeautifulSoup
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json,*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          pages=[
            ('reportify','https://reportify.cn/reports/1105126013194604544'),
            ('fxbaogao','https://www.fxbaogao.com/detail/5488726'),
            ('eastmoney','https://hk.eastmoney.com/rating.html?code=03658'),
          ]
          needles=['1105126013194604544','5488726','03658','新希望服务','pdf','download','sourceurl','originalurl','fileurl','reporturl','attachment','api/','graphql','reportdetail','rating','targetprice','infocode']
          def contexts(text, needle, span=450, limit=25):
            low=text.lower(); nd=needle.lower(); start=0; n=0
            while n<limit:
              i=low.find(nd,start)
              if i<0: break
              print('CTX',needle,repr(text[max(0,i-span):i+span].replace('\n',' ')[:span*2]))
              start=i+len(nd); n+=1
          for name,url in pages:
            print('\n===== PAGE',name,url,'=====')
            r=S.get(url,timeout=45,allow_redirects=True,verify=False)
            print('STATUS',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            html=r.text
            for nd in needles:
              if nd.lower() in html.lower(): contexts(html,nd,400,8)
            soup=BeautifulSoup(html,'html.parser')
            scripts=[]
            for s in soup.find_all('script'):
              src=s.get('src')
              if src: scripts.append(urllib.parse.urljoin(r.url,src))
              else:
                txt=s.string or s.get_text() or ''
                if txt and any(nd.lower() in txt.lower() for nd in needles):
                  print('INLINE_SCRIPT_LEN',len(txt))
                  for nd in needles:
                    if nd.lower() in txt.lower(): contexts(txt,nd,500,8)
            print('SCRIPT_COUNT',len(scripts))
            for idx,src in enumerate(scripts):
              try:
                rr=S.get(src,timeout=35,verify=False)
                txt=rr.text
                hits=[nd for nd in needles if nd.lower() in txt.lower()]
                if hits:
                  print('\nSCRIPT_HIT',idx,src,'len',len(txt),'hits',hits)
                  for nd in hits:
                    contexts(txt,nd,550,5)
              except Exception as e: print('SCRIPTERR',idx,src,e)
          PY
