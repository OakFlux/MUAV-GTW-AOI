name: Resolve and package public China Tower broker reports

on:
  push:
    branches:
      - tmp/hangyan-china-tower-resolve-20260905

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and PDF tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
          python -m pip install --quiet pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Resolve public report entries and download original PDFs
        run: node tmp/resolve_hangyan_china_tower_reports.mjs
      - name: Validate PDFs and build ZIP
        run: python tmp/package_hangyan_china_tower_reports.py
      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: china-tower-00788-public-broker-reports
          path: out_hangyan_china_tower_resolve/China_Tower_00788_Broker_Research_Reports.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-tower-hangyan-resolution-diagnostics
          path: |
            out_hangyan_china_tower_resolve/*.json
            out_hangyan_china_tower_resolve/*.txt
            out_hangyan_china_tower_resolve/*.html
          if-no-files-found: warn
          retention-days: 1
