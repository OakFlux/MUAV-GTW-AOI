name: Build CGN New Energy broker research report package

on:
  push:
    branches:
      - tmp/cgn-new-energy-broker-reports-20260907

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and PDF tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
          python -m pip install --quiet pypdf fonttools
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Collect publicly accessible original PDFs
        run: node tmp/collect_cgnne_reports_20260907.mjs

      - name: Validate and package reports
        run: python tmp/package_cgnne_reports_20260907.py

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: cgn-new-energy-01811-broker-reports
          path: out_cgnne_reports_20260907/CGN_New_Energy_01811_Broker_Research_Reports.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgn-new-energy-report-diagnostics
          path: out_cgnne_reports_20260907/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
