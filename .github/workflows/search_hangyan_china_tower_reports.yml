name: Search Hangyan for China Tower research PDFs

on:
  push:
    branches:
      - tmp/china-tower-hangyan-search-20260905

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Search reports and collect public PDFs
        run: node tmp/search_hangyan_china_tower_reports.mjs
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: china-tower-hangyan-search
          path: out_china_tower_hangyan_search/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
