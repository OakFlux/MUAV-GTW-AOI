name: Search Huayan Robotics narrow Eastmoney windows

on:
  push:
    branches:
      - tmp/huayan-eastmoney-narrow-20260905

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/search_huayan_eastmoney_narrow.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-eastmoney-narrow
          path: out_huayan_eastmoney_narrow/*
          if-no-files-found: error
          retention-days: 1
