name: Inspect Sina HK report JS and API

on:
  push:
    branches:
      - tmp/huayan-sina-js-20260905

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]' pypdf
      - run: python tmp/inspect_sina_hk_report_js.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-sina-hk-report-js
          path: out_sina_hk_report_js/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
