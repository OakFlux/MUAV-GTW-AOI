name: Inspect Huayan 1021 public document page

on:
  push:
    branches:
      - tmp/huayan-1c9u-doc-20260905

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/inspect_huayan_1c9u_document.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-1c9u-document-inspection
          path: out_huayan_1c9u_doc/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
