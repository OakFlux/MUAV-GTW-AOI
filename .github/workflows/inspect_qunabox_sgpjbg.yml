name: Inspect Qunabox SGPJBG reports
on:
  push:
    branches:
      - tmp/qunabox-sgpjbg-discovery-20260906
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - run: node tmp/inspect_qunabox_sgpjbg.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: qunabox-sgpjbg-discovery
          path: out_qunabox_sgpjbg_discovery/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
