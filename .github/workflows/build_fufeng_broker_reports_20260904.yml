name: Build Fufeng Group broker deep research report package

on:
  push:
    branches:
      - tmp/fufeng-broker-reports-20260904

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install search download and PDF validation tools
        run: |
          python -m pip install --quiet 'httpx[http2]' beautifulsoup4 pypdf ddgs
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Discover download validate and package reports
        run: python tmp/build_fufeng_broker_reports_20260904.py

      - name: Upload verified ZIP and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fufeng-group-00546-broker-deep-reports
          path: |
            out_fufeng_broker_reports_20260904/Fufeng_Group_00546_Broker_Deep_Research_Reports.zip
            out_fufeng_broker_reports_20260904/valid_reports.json
            out_fufeng_broker_reports_20260904/all_link_candidates.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
