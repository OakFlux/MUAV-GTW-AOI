name: Build Fufeng broker research report package

on:
  push:
    branches:
      - tmp/fufeng-broker-package-20260904

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install download, image and PDF tools
        run: |
          python -m pip install --quiet 'httpx[http2]' pillow img2pdf pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Normalize harmless title punctuation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tmp/build_fufeng_broker_reports_20260904.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'normalized_page_title = re.sub(r"\\s+", "", parsed["page_title"])',
              'normalized_page_title = re.sub(r"[\\s：:]", "", parsed["page_title"])',
          )
          text = text.replace(
              'normalized_expected_title = re.sub(r"\\s+", "", report["title"])',
              'normalized_expected_title = re.sub(r"[\\s：:]", "", report["title"])',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and validate report package
        run: python tmp/build_fufeng_broker_reports_20260904.py

      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fufeng-group-00546-broker-research-reports
          path: out_fufeng_broker_reports_20260904/Fufeng_Group_00546_Broker_Research_Reports_3.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
