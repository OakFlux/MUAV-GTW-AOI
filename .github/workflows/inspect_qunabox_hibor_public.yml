name: Inspect public Hibor Qunabox report page

on:
  push:
    branches:
      - tmp/qunabox-boci-hibor-20260906

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Inspect public pages and attached files
        run: python tmp/inspect_qunabox_hibor_public.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qunabox-hibor-public
          path: out_qunabox_hibor_public/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
