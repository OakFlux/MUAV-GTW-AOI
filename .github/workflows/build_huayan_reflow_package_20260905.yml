name: Build Huayan Robotics public full-text research report package

on:
  push:
    branches:
      - tmp/huayan-reflow-package-20260905

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF generation and validation tools
        run: |
          python -m pip install --quiet 'httpx[http2]' beautifulsoup4 pillow pypdf weasyprint
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils qpdf
      - name: Build and validate three reports
        run: python tmp/build_huayan_reflow_package_20260905.py
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: huayan-robotics-01021-research-reports
          path: out_huayan_reflow_package/Huayan_Robotics_01021_Broker_Research_Reports_3.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
