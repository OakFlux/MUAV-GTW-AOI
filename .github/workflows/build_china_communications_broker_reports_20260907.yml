name: Build China Communications Construction broker research package

on:
  push:
    branches:
      - tmp/china-communications-broker-reports-20260907

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF download and validation tools
        run: |
          python -m pip install --quiet requests pypdf fonttools
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download, validate and package reports
        run: python tmp/build_china_communications_broker_reports_20260907.py

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: china-communications-601800-01800-broker-deep-reports
          path: out_china_communications_reports_20260907/China_Communications_Construction_601800_01800_Broker_Deep_Reports.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: china-communications-report-diagnostics
          path: out_china_communications_reports_20260907/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
