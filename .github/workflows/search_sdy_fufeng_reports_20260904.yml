name: Search Sdyanbao for Fufeng research reports

on:
  push:
    branches:
      - tmp/fufeng-sdy-search-20260904

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - run: python tmp/search_sdy_fufeng_reports_20260904.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdy-fufeng-search-results
          path: out_sdy_fufeng_search/*
          if-no-files-found: error
          retention-days: 1
