name: Quick exact SDICSI Ascletis probe

on:
  push:
    branches:
      - tmp/ascletis-sdicsi-quick-20260906

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - run: python tmp/quick_ascletis_sdicsi.py
      - uses: actions/upload-artifact@v4
        with:
          name: ascletis-sdicsi-quick
          path: out_ascletis_sdicsi_quick/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
