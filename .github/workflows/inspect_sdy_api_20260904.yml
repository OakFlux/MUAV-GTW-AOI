name: Inspect Sdyanbao public search API

on:
  push:
    branches:
      - tmp/sdy-api-inspect-20260904

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/inspect_sdy_api_20260904.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdy-api-inspection
          path: out_sdy_api_inspect/*
          if-no-files-found: error
          retention-days: 1
