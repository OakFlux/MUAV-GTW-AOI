name: Collect Ascletis deep broker report PDFs v2

on:
  push:
    branches:
      - tmp/ascletis-broker-reports-20260906

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Collect public full PDFs
        run: node tmp/collect_ascletis_deep_v2.mjs
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-01672-deep-v2
          path: out_ascletis_deep_v2/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
