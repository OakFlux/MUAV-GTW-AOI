name: Build Xinyi Glass 2020-2025 annual reports and latest interim disclosure

on:
  push:
    branches:
      - tmp/xinyi-glass-financials-20260902

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: python -m pip install --quiet pypdf

      - name: Download and validate official reports
        run: python tmp/build_xinyi_glass_financials_20260902.py

      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-glass-00868-2020-2025-annual-reports-latest-interim
          path: out_xinyi_glass_financials_20260902/reports/*
          if-no-files-found: error
          retention-days: 1
