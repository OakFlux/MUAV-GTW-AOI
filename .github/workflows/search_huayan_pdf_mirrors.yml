name: Search public Huayan Robotics broker PDF mirrors

on:
  push:
    branches:
      - tmp/huayan-search-engines-20260905

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]' beautifulsoup4 pypdf
      - run: python tmp/search_huayan_pdf_mirrors.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-public-pdf-search
          path: out_huayan_pdf_search/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
