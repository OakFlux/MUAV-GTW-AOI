name: Download all known public Xinyi Solar Hangyan reports

on:
  push:
    branches:
      - tmp/xinyi-solar-hangyan-known-all-20260905

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Download known public reports
        run: node tmp/download_xinyi_solar_known_hangyan_all.mjs
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-solar-hangyan-known-all
          path: out_xinyi_solar_hangyan_known_all/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
