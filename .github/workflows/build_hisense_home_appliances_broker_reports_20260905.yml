name: Build Hisense Home Appliances broker deep research report package

on:
  push:
    branches:
      - tmp/hisense-home-appliances-broker-reports-20260905

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: |
          python -m pip install --quiet requests pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Search, download, validate and package reports
        run: python tmp/build_hisense_home_appliances_broker_reports_20260905.py

      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hisense-home-appliances-broker-deep-reports
          path: out_hisense_home_appliances_broker_reports_20260905/Hisense_Home_Appliances_000921_Broker_Deep_Research_Reports.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
