name: Find Eastmoney Huayan Robotics report PDFs

on:
  push:
    branches:
      - tmp/huayan-eastmoney-title-20260905

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet httpx pypdf
      - run: python tmp/find_eastmoney_huayan_titles.py
      - uses: actions/upload-artifact@v4
        with:
          name: huayan-eastmoney-title-search
          path: out_huayan_eastmoney_title/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
