name: Inspect Guotai Haitong public Huayan report API

on:
  push:
    branches:
      - tmp/gtht-huayan-public-search-20260905

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/inspect_gtht_huayan_public_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtht-huayan-public-api-inspection
          path: out_gtht_huayan_public/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
