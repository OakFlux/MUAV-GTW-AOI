name: Download known public Xinyi Solar Hangyan reports

on:
  push:
    branches:
      - tmp/xinyi-solar-known-public-reports-20260905

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Download and verify public reports
        run: python tmp/download_xinyi_solar_known_hangyan_reports.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-solar-known-public-reports
          path: out_xinyi_solar_known_hangyan/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
