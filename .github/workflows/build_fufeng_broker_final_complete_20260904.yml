name: Build final complete Fufeng broker report package

on:
  push:
    branches:
      - tmp/fufeng-broker-final-complete-20260904

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image and PDF tools
        run: |
          python -m pip install --quiet 'httpx[http2]' pillow img2pdf pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download all public pages and build verified PDFs
        run: python tmp/build_fufeng_broker_final_complete_20260904.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fufeng-group-00546-broker-research-reports-complete
          path: out_fufeng_broker_final_20260904/Fufeng_Group_00546_Broker_Research_Reports_3_Complete.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
