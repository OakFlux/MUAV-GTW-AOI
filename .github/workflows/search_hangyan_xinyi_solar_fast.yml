name: Fast Hangyan search for Xinyi Solar broker reports

on:
  push:
    branches:
      - tmp/xinyi-solar-hangyan-fast-20260905

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Search and download public report PDFs
        run: node tmp/search_hangyan_xinyi_solar_fast.mjs
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-solar-hangyan-fast
          path: out_xinyi_solar_hangyan_fast/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
