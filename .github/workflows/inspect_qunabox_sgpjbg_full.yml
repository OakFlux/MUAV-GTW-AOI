name: Inspect Qunabox SGPJBG anonymous full viewer

on:
  push:
    branches:
      - tmp/qunabox-boci-hibor-20260906

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Inspect anonymous online reader
        run: node tmp/inspect_qunabox_sgpjbg_full.mjs
      - name: Upload diagnostics and files
        uses: actions/upload-artifact@v4
        with:
          name: qunabox-sgpjbg-full-viewer
          path: out_qunabox_sgpjbg_full/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
