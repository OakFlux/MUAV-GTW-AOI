name: Inspect NXNY Huayan Robotics 1021 reports

on:
  push:
    branches:
      - tmp/huayan-nxny-20260905

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'httpx[http2]'
      - run: python tmp/inspect_nxny_huayan_1021.py
      - uses: actions/upload-artifact@v4
        with:
          name: nxny-huayan-1021-inspection
          path: out_nxny_huayan_1021/*
          if-no-files-found: error
          retention-days: 1
