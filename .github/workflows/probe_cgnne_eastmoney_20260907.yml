name: Probe Eastmoney for CGN New Energy research reports

on:
  push:
    branches:
      - tmp/cgnne-eastmoney-20260907

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests pypdf fonttools
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Probe API, download, validate and package
        run: python tmp/probe_cgnne_eastmoney_20260907.py
      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cgnne-eastmoney-reports
          path: out_cgnne_eastmoney_20260907/CGN_New_Energy_01811_Eastmoney_Reports.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgnne-eastmoney-diagnostics
          path: out_cgnne_eastmoney_20260907/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
