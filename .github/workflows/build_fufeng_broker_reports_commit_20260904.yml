name: Build and publish temporary Fufeng broker report package

on:
  push:
    branches:
      - tmp/fufeng-broker-reports-20260904
    paths:
      - '.github/workflows/build_fufeng_broker_reports_commit_20260904.yml'
      - 'tmp/build_fufeng_broker_reports_20260904.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fufeng-broker-reports-20260904
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install search download and PDF validation tools
        run: |
          python -m pip install --quiet 'httpx[http2]' beautifulsoup4 pypdf ddgs
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Discover download validate and package reports
        run: python tmp/build_fufeng_broker_reports_20260904.py

      - name: Commit temporary verified package to branch
        run: |
          mkdir -p generated/fufeng_broker_reports_20260904
          cp out_fufeng_broker_reports_20260904/Fufeng_Group_00546_Broker_Deep_Research_Reports.zip generated/fufeng_broker_reports_20260904/
          cp out_fufeng_broker_reports_20260904/valid_reports.json generated/fufeng_broker_reports_20260904/
          cp out_fufeng_broker_reports_20260904/all_link_candidates.json generated/fufeng_broker_reports_20260904/
          git config user.name 'OpenAI Research Packager'
          git config user.email 'actions@users.noreply.github.com'
          git add generated/fufeng_broker_reports_20260904
          git commit -m 'Add verified Fufeng broker research package [skip ci]'
          git push origin HEAD:tmp/fufeng-broker-reports-20260904
