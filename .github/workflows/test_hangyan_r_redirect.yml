name: Test Hangyan protected report redirect
on:
  push:
    branches:
      - tmp/hangyan-protected-controller-inspect-20260906
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tmp/test_hangyan_r_redirect.py
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-r-redirect-test
          path: out_hangyan_redirect_test/*
          retention-days: 1
          compression-level: 0
