name: Build LifeTech Scientific broker research report package

on:
  push:
    branches:
      - tmp/lifetech-broker-reports-20260906

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and PDF tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
          python -m pip install --quiet pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Fetch public complete report PDFs
        run: node tmp/fetch_lifetech_broker_reports_20260906.mjs

      - name: Validate and package reports
        run: python tmp/package_lifetech_broker_reports_20260906.py

      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lifetech-01302-broker-research-reports
          path: out_lifetech_broker_reports_20260906/LifeTech_Scientific_01302_Broker_Research_Reports.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
