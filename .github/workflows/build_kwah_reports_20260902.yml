name: Build K Wah International DBS research pack

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build PDFs and ZIP
        run: node tmp/build_kwah_reports_20260902.mjs

      - name: Validate PDFs and archive
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from pypdf import PdfReader

          base = Path('out_kwah_20260902')
          pdfs = sorted((base / 'reports').glob('*.pdf'))
          assert len(pdfs) == 3, f'Expected 3 PDFs, got {len(pdfs)}'
          for p in pdfs:
              reader = PdfReader(str(p))
              assert len(reader.pages) >= 2, f'Too few pages in {p}: {len(reader.pages)}'
              text = ''.join((page.extract_text() or '') for page in reader.pages[:3])
              assert 'Wah International' in text or 'K.Wah International' in text or 'K. Wah International' in text, f'Missing company name in {p}'
              print(p.name, len(reader.pages), p.stat().st_size)
          z = base / 'KWah_International_00173_DBS_Research_3_reports.zip'
          assert z.exists() and z.stat().st_size > 100000
          with ZipFile(z) as zf:
              bad = zf.testzip()
              assert bad is None, f'Bad ZIP member: {bad}'
              assert len([n for n in zf.namelist() if n.lower().endswith('.pdf')]) == 3
              print('ZIP', z.stat().st_size, zf.namelist())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kwah-international-00173-dbs-research-pack
          path: out_kwah_20260902/KWah_International_00173_DBS_Research_3_reports.zip
          if-no-files-found: error
          retention-days: 1
