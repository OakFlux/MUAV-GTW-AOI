name: Exhaustive Eastmoney search for Huayan reports

on:
  push:
    branches:
      - tmp/huayan-eastmoney-list2-v3

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Search list2 and traverse all reports
        run: python tmp/fetch_huayan_eastmoney_list2.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: huayan-eastmoney-list2
          path: out_huayan_eastmoney_list2/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
