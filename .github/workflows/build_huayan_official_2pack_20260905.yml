name: Build Huayan Robotics official broker research package

on:
  push:
    branches:
      - tmp/huayan-official-2pack-20260905

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: |
          python -m pip install --quiet 'httpx[http2]' pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf
      - name: Download, validate and package two official PDFs
        run: python tmp/build_huayan_official_2pack_20260905.py
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: huayan-robotics-01021-official-broker-research
          path: out_huayan_official_2pack/Huayan_Robotics_01021_Broker_Research_Reports_2.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
