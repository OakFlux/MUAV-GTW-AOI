name: Rebuild Ascletis broker report package from public Hangyan pages

on:
  push:
    branches:
      - tmp/ascletis-hangyan-rebuild-20260906

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and PDF tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
          python -m pip install --quiet pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Resolve protected report links and download PDFs
        run: node tmp/resolve_ascletis_protected_links_20260906.mjs
      - name: Validate and package resolved reports
        run: python tmp/package_ascletis_resolved_20260906.py
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-01672-reports-new
          path: out_ascletis_final/ascletis_01672_reports_new.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-01672-resolver-diagnostics
          path: |
            out_ascletis_resolved/*
            out_ascletis_final/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
