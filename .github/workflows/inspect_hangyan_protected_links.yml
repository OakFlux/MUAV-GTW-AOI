name: Inspect Hangyan protected links
on:
  push:
    branches:
      - tmp/hangyan-protected-link-20260906
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - run: node tmp/inspect_hangyan_protected_links.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-protected-link-inspection
          path: out_hangyan_protected_links/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
