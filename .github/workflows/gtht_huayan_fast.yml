name: Fast Guotai Haitong Huayan API probe
on:
  push:
    branches: [tmp/gtht-huayan-fast-20260905]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet httpx
      - run: python tmp/gtht_huayan_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: gtht-huayan-fast
          path: out_gtht_huayan_fast/*
          if-no-files-found: error
          retention-days: 1
