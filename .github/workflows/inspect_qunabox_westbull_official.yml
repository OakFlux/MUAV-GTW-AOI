name: Inspect West Bull official Qunabox report

on:
  push:
    branches:
      - tmp/qunabox-westbull-official-20260906

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Inspect official research site and download PDFs
        run: node tmp/inspect_qunabox_westbull_official.mjs
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qunabox-westbull-official
          path: out_qunabox_westbull_official/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
